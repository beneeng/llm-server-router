[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-server"
version = "0.1.0"
description = "Personal MLX LLM router: per-model vllm-mlx processes behind a single OpenAI-compatible endpoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "psutil>=5.9",
    "mlx-lm>=0.31",
    "pytest>=9.0.3",
    "pip>=26.1.2",
    "iniconfig>=2.3.0",
    "pluggy>=1.6.0",
]

[project.scripts]
mlx = "mlx_server.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["mlx_server"]
